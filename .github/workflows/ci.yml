name: CI / Enterprise Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Apache Flink Streaming Engine (Java 17 & Maven)
  # ---------------------------------------------------------------------------
  flink-ci:
    name: Flink Engine (Java 17 / CEP Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flink-processor

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Flink CEP & Window Operator Unit Tests
        run: mvn test --batch-mode

      - name: Verify Shaded Executable Fat JAR Assembly
        run: mvn package -DskipTests=true --batch-mode

  # ---------------------------------------------------------------------------
  # Job 2: Python Code Quality & Serverless Lambda Unit Tests (Moto Mocking)
  # ---------------------------------------------------------------------------
  python-ci:
    name: Python Quality & Lambda Idempotency Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest moto[dynamodb,sns,sqs] boto3 numpy

      - name: Execute Static Linting with Ruff
        run: |
          ruff check generator/ lambda-alerter/

      - name: Run Lambda Idempotency Unit Tests
        run: |
          pytest lambda-alerter/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 3: Infrastructure as Code (Terraform Quality & Validation)
  # ---------------------------------------------------------------------------
  terraform-ci:
    name: Terraform Format & Syntax Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Verify Terraform Formatting
        run: terraform fmt -check

      - name: Initialize Terraform Providers (Backend-less)
        run: terraform init -backend=false

      - name: Validate Terraform Syntax & Resource References
        run: terraform validate

